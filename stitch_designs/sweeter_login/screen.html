      </p>

<form class="mt-space-xl flex flex-col gap-space-md" onsubmit="event.preventDefault(); handleLoginSubmit();">

</div>

<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[1.25rem]">lock</span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md pl-11 pr-11 py-3 rounded-lg focus:outline-none focus:bg-surface-container-lowest focus:shadow-sm transition-all duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface focus:outline-none transition-colors p-1" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[1.25rem]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="w-4 h-4 rounded text-primary-container focus:ring-0 focus:outline-none accent-primary-container cursor-pointer transition" id="remember" name="remember" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors underline-offset-2 hover:underline" href="#forgot">
          Forgot password?
        </a>
</div>
<button class="w-full mt-space-xs py-3.5 px-space-lg rounded-full bg-primary-container text-on-primary font-label-md text-label-md shadow-sm hover:bg-primary active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2 group cursor-pointer" id="submitBtn" type="submit">

</button>

<button class="flex items-center justify-center gap-2.5 py-3 px-space-md rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md transition-colors duration-150 active:scale-[0.98] cursor-pointer" type="button">
<svg aria-hidden="true" class="w-4 h-4 flex-shrink-0" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>

<svg aria-hidden="true" class="w-4 h-4 flex-shrink-0 fill-current" viewbox="0 0 24 24">

</svg>

<div class="mt-space-xl pt-space-md text-center bg-surface-container-low/50 rounded-lg p-space-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        New to Sweeter? 
        <a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors ml-1 font-semibold underline-offset-2 hover:underline" href="#signup">
          Create an account
        </a>
</p>
</div>
</div>
<div class="mt-space-md flex items-center justify-center gap-space-lg text-outline">
<a class="font-label-sm text-label-sm hover:text-on-surface transition-colors" href="#privacy">Privacy</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="font-label-sm text-label-sm hover:text-on-surface transition-colors" href="#terms">Terms</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="font-label-sm text-label-sm hover:text-on-surface transition-colors" href="#guidelines">Guidelines</a>
</div>
</div>
<script>
  (function initAuthInteractions() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isCurrentPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isCurrentPassword ? 'text' : 'password');
        eyeIcon.textContent = isCurrentPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();

  function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[1.25rem]">progress_activity</span><span>Signing in...</span>';
    btn.classList.add('opacity-80', 'pointer-events-none');
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[1.25rem]">check</span><span>Signed In</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('opacity-80', 'pointer-events-none');
      }, 1200);
    }, 900);
  }
</script></main></body></html>
