<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Post Detail — Sweeter</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='mystyle.css') }}"/>
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface-container-highest": "#e3e2e0", "background": "#faf9f7",
            "surface-container-high": "#e9e8e6", "on-primary": "#ffffff",
            "on-surface-variant": "#514443", "on-error-container": "#93000a",
            "secondary-container": "#ecdcd8", "error": "#ba1a1a",
            "outline": "#837373", "surface-container-lowest": "#ffffff",
            "primary-container": "#583030", "surface": "#faf9f7",
            "surface-container": "#efeeec", "surface-container-low": "#f4f3f1",
            "secondary": "#675c59", "on-surface": "#1a1c1b",
            "on-secondary-container": "#6b605d", "error-container": "#ffdad6",
            "outline-variant": "#d5c2c1", "primary": "#3e1b1b"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: {
            "space-md": "1rem", "margin-desktop": "2.5rem", "space-xs": "0.25rem",
            "space-lg": "1.5rem", "space-sm": "0.5rem"
          },
          fontFamily: { "body-md": ["Manrope"], "headline-sm": ["Manrope"], "label-md": ["Manrope"], "caption": ["Manrope"], "label-sm": ["Manrope"] }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">

<header class="fixed top-0 left-0 right-0 z-40 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(88,48,48,0.04)]">
  <div class="h-16 max-w-7xl mx-auto px-4 md:px-margin-desktop flex items-center justify-between">
    <div class="flex items-center gap-space-sm">
      <a href="/" class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight no-underline">Sweeter</a>
    </div>
    <nav class="hidden lg:flex items-center gap-space-md">
      <a class="px-space-md py-space-xs text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md rounded-full no-underline" href="/">Timeline</a>
      <a class="px-space-md py-space-xs text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md rounded-full no-underline" href="/explore">Explore</a>
      <a class="px-space-md py-space-xs text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md rounded-full no-underline" href="/bookmarks">Bookmarks</a>
      <a class="px-space-md py-space-xs text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md rounded-full no-underline flex items-center gap-1.5" href="/notifications">
        <span>Notifications</span>
        <span id="header-unread-badge" class="hidden bg-primary-container text-on-primary text-[10px] font-bold px-1.5 py-0.2 rounded-full"></span>
      </a>
    </nav>
    <div class="flex items-center gap-space-md">
      <a href="/user/{{ user_info.username | e }}" class="flex items-center gap-space-sm no-underline text-inherit">
        <span class="font-label-md text-label-md text-on-surface hidden sm:inline-block">{{ user_info.profile_name | e }}</span>
        <img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="/static/{{ user_info.profile_pic_real | e }}" onerror="this.src='/static/profile_pics/profile_placeholder.png'"/>
      </a>
    </div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 md:px-margin-desktop">
  <aside class="hidden md:flex fixed top-16 left-[max(1rem,calc((100vw-80rem)/2+2.5rem))] h-[calc(100vh-4rem)] w-[240px] z-30 flex-col justify-between py-space-lg pr-space-md bg-transparent">
    <div class="flex flex-col gap-space-lg">
      <nav class="flex flex-col gap-space-xs">
        <a class="flex items-center gap-space-md px-space-md py-space-sm rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all no-underline" href="/">
          <span class="material-symbols-outlined text-[22px]">home</span>
          <span class="font-label-md text-label-md">Home</span>
        </a>
        <a class="flex items-center gap-space-md px-space-md py-space-sm rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all no-underline" href="/explore">
          <span class="material-symbols-outlined text-[22px]">explore</span>
          <span class="font-label-md text-label-md">Explore</span>
        </a>
        <a class="flex items-center gap-space-md px-space-md py-space-sm rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all no-underline" href="/user/{{ user_info.username | e }}">
          <span class="material-symbols-outlined text-[22px]">person</span>
          <span class="font-label-md text-label-md">Profile</span>
        </a>
        <a class="flex items-center justify-between px-space-md py-space-sm rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all no-underline" href="/drafts">
          <div class="flex items-center gap-space-md">
            <span class="material-symbols-outlined text-[22px]">drafts</span>
            <span class="font-label-md text-label-md">Drafts</span>
          </div>
          <span id="nav-drafts-badge" class="hidden bg-secondary-container text-on-secondary-container text-caption font-bold px-2 py-0.5 rounded-full text-[11px] leading-tight"></span>
        </a>
        <a class="flex items-center gap-space-md px-space-md py-space-sm rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all no-underline" href="/bookmarks">
          <span class="material-symbols-outlined text-[22px]">bookmark</span>
          <span class="font-label-md text-label-md">Bookmarks</span>
        </a>
        <a class="flex items-center justify-between px-space-md py-space-sm rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all no-underline" href="/notifications">
          <div class="flex items-center gap-space-md">
            <span class="material-symbols-outlined text-[22px]">notifications</span>
            <span class="font-label-md text-label-md">Notifications</span>
          </div>
          <span id="nav-unread-badge" class="hidden bg-primary-container text-on-primary text-caption font-bold px-2 py-0.5 rounded-full text-[11px] leading-tight"></span>
        </a>
      </nav>
    </div>
  </aside>

  <div class="pl-0 md:pl-[264px] pr-0 xl:pr-[344px] min-h-screen">
    <main class="relative pt-16 bg-transparent max-w-[620px] mx-auto min-h-screen py-space-lg">
      <section class="sticky top-16 z-20 backdrop-blur-md bg-surface/90 px-space-md py-space-sm mb-space-md border-b border-surface-container/60 flex items-center gap-3">
        <a href="javascript:history.back()" class="p-1.5 rounded-full hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface no-underline flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </a>
        <h1 class="font-headline-sm text-headline-sm text-primary font-bold m-0">Detail Postingan</h1>
      </section>

      <div id="post-box" class="flex flex-col gap-space-md">
        <div class="text-center text-on-surface-variant py-8 font-body-sm">
          <i class="fa fa-spinner fa-spin text-xl text-primary mr-2"></i> Memuat postingan…
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Quote Post Modal -->
<div id="quote-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-lg shadow-xl border border-outline-variant/30 overflow-hidden flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between px-5 py-3.5 border-b border-surface-container-high">
      <h3 class="font-headline-sm text-[17px] font-bold text-on-surface m-0">Kutip Postingan</h3>
      <button type="button" onclick="close_quote_modal()" class="p-1 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors border-0 bg-transparent cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <div class="p-5 overflow-y-auto flex-1">
      <input type="hidden" id="quote-target-id" value="" />
      <textarea id="quote-textarea" class="w-full bg-surface-container-low rounded-xl p-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary-container resize-none transition-all" rows="3" maxlength="5000" placeholder="Tambahkan komentar Anda..."></textarea>
      <div id="quote-preview-card" class="mt-3 p-3.5 rounded-xl border border-outline-variant/50 bg-surface-container-low/60">
        <div class="flex items-center gap-2 mb-1.5">
          <img id="quote-preview-avatar" class="w-6 h-6 rounded-full object-cover shrink-0" src="/static/profile_pics/profile_placeholder.png" alt=""/>
          <span id="quote-preview-name" class="font-label-sm font-semibold text-on-surface"></span>
          <span id="quote-preview-username" class="font-caption text-on-surface-variant"></span>
        </div>
        <p id="quote-preview-comment" class="font-body-sm text-on-surface whitespace-pre-wrap leading-relaxed line-clamp-3 m-0"></p>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-surface-container-high bg-surface-container-low/30">
      <button type="button" onclick="close_quote_modal()" class="px-4 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-colors border-0 bg-transparent cursor-pointer">Batal</button>
      <button type="button" id="btn-submit-quote" onclick="submit_quote_post()" class="px-5 py-1.5 rounded-full bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary transition-colors border-0 cursor-pointer shadow-sm">Kirim Kutipan</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='myjs.js') }}"></script>
<script>
  $(document).ready(function () {
    load_single_post_detail('{{ post_id | e }}');
  });
</script>
</body>
</html>
