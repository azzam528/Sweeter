<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>User Not Found — Sweeter</title>

  <!-- Google Fonts: Manrope + Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

  <!-- Sweeter custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='mystyle.css') }}"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#faf9f7",
            "primary": "#3e1b1b",
            "primary-container": "#583030",
            "on-primary": "#ffffff",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#514443",
            "surface-container": "#efeeec",
            "surface-container-low": "#f4f3f1",
            "surface-container-lowest": "#ffffff"
          },
          fontFamily: {
            "body": ["Manrope", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body text-on-surface antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="h-16 border-b border-surface-container flex items-center px-6">
    <a href="/" class="text-2xl font-bold text-primary-container tracking-tight no-underline">Sweeter</a>
  </header>

  <!-- 404 Card -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-surface-container-lowest rounded-2xl p-8 shadow-sm text-center">
      <div class="w-16 h-16 rounded-full bg-surface-container-low text-primary-container mx-auto flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-[32px]">person_off</span>
      </div>
      <h1 class="text-2xl font-bold text-primary mb-2">User Not Found</h1>
      <p class="text-on-surface-variant mb-6 text-sm leading-relaxed">
        The user profile <strong class="text-primary-container">@{{ username | e }}</strong> does not exist or has been removed.
      </p>
      <div class="flex justify-center gap-3">
        <a href="/" class="px-6 py-2.5 bg-primary-container text-on-primary rounded-full font-semibold text-sm hover:bg-primary transition-all shadow-sm no-underline inline-block">
          Back to Home Feed
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-on-surface-variant">
    © 2025 Sweeter
  </footer>

</body>
</html>
